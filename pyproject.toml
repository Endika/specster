[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specster"
version = "0.3.2"
description = "Haunts your issues until they're clear."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Endika Iglesias", email = "endika2@gmail.com" }]
dependencies = [
    "anthropic[bedrock,vertex]>=1.8.0",
    "azure-identity>=1.25.3",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "openai>=3.19.1",
    "pathspec>=1.1.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tree-sitter-language-pack>=1.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/specster"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "ARG", "TID", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002"]
"evals/*" = ["ARG002"]

[tool.mypy]
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests", "evals"]
exclude = ["^evals/fixtures/"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tree_sitter_language_pack.*", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not eval'"
markers = ["eval: calls real models; run explicitly with -m eval"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
