name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check --diff .
      - run: uv run mypy

  test:
    name: tests on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups
      - run: uv run pytest --block-network

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t specster:ci .
      - name: self-check with no network (grammars and deps must be baked in)
        run: docker run --rm --network none specster:ci --self-check
      - name: a repo-root secrets.py cannot shadow our imports
        run: |
          work="$(mktemp -d)"
          printf 'raise SystemExit(99)\n' > "$work/secrets.py"
          docker run --rm --network none -v "$work:/work" -w /work specster:ci --self-check
      - name: a test process cannot read the parent's environment, /proc/1/environ or .git/config
        run: |
          canary="$(openssl rand -hex 16)"
          docker run --rm --network none -e SPECSTER_ISOLATION_CANARY="$canary" specster:ci --isolation-check
      - name: the full suite as root inside the image, root-only sandbox tests included
        run: |
          git ls-files -z | tar --null -T - -cf - | docker run -i --rm --entrypoint sh \
            -e UV_PROJECT_ENVIRONMENT=/src/.venv specster:ci -c \
            'mkdir /src && cd /src && tar xf - && uv sync --all-groups --locked && uv run pytest --block-network -W error'
      - name: this repo's own setup and test commands pass as a sandbox slot, as a worker runs them
        run: |
          git ls-files -z | tar --null -T - -cf - | docker run -i --rm --entrypoint sh specster:ci -c \
            'mkdir /work && cd /work && tar xf - && /app/.venv/bin/python -P tests/dogfood_as_slot.py /work'

  all-green:
    name: all-green
    needs: [quality, test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job must have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
