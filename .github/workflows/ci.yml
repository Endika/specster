name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check --diff .
      - run: uv run mypy

  test:
    name: tests on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups
      - run: uv run pytest --block-network

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t specster:ci .
      - name: self-check with no network (grammars and deps must be baked in)
        run: docker run --rm --network none specster:ci --self-check
      - name: a repo-root secrets.py cannot shadow our imports
        run: |
          work="$(mktemp -d)"
          printf 'raise SystemExit(99)\n' > "$work/secrets.py"
          docker run --rm --network none -v "$work:/work" -w /work specster:ci --self-check

  all-green:
    name: all-green
    needs: [quality, test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job must have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
