name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  image:
    name: publish image and move major tag
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.please.outputs.tag }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/endika/specster:${{ needs.please.outputs.tag }}
            ghcr.io/endika/specster:v${{ needs.please.outputs.major }}
      - name: "point v<major> at this release so `uses: Endika/specster@v0` follows it"
        env:
          TAG: ${{ needs.please.outputs.tag }}
          MAJOR: v${{ needs.please.outputs.major }}
        run: |
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
