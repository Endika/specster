name: Evals

on:
  workflow_dispatch:
    inputs:
      provider: { description: Provider under test, default: anthropic }
      model: { description: Model under test, default: claude-haiku-4-5 }
      k: { description: Runs per case, default: "3" }
      max_usd: { description: Hard cap for this run, default: "2.0" }
      judge_model: { description: Model that grades the specs, default: claude-sonnet-5 }
      suite:
        description: Which evals to run
        type: choice
        options: [all, calibration, behavior, injection, build]
        default: all
      skills:
        description: For the build suite, whether workers and reviewer get this repo's skills
        type: choice
        options: ["on", "off"]
        default: "on"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: evals
        if: inputs.suite != 'build'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPECSTER_EVAL_PROVIDER: ${{ inputs.provider }}
          SPECSTER_EVAL_MODEL: ${{ inputs.model }}
          SPECSTER_JUDGE_MODEL: ${{ inputs.judge_model }}
          SUITE: ${{ inputs.suite }}
          EVAL_K: ${{ inputs.k }}
          EVAL_MAX_USD: ${{ inputs.max_usd }}
        run: >
          case "$SUITE" in all) target=evals;; calibration) target=evals/test_judge_calibration.py;;
          *) target="evals/test_$SUITE.py";; esac;
          uv run pytest "$target" -m eval -v
          --eval-k "$EVAL_K" --eval-max-usd "$EVAL_MAX_USD"
          --eval-out "$RUNNER_TEMP/specster-evals.jsonl"
      # Builds run sandbox slots, so the build suite runs as root inside the image.
      - run: docker build -t specster:evals .
        if: inputs.suite == 'build'
      - name: build evals, inside the image
        if: inputs.suite == 'build'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPECSTER_EVAL_MODEL: ${{ inputs.model }}
          SPECSTER_EVAL_SKILLS: ${{ inputs.skills }}
          EVAL_K: ${{ inputs.k }}
          EVAL_MAX_USD: ${{ inputs.max_usd }}
        run: >
          git ls-files -z | tar --null -T - -cf - | docker run -i --rm --entrypoint /usr/bin/tini
          -e ANTHROPIC_API_KEY -e SPECSTER_EVAL_MODEL -e SPECSTER_EVAL_SKILLS -e EVAL_K -e EVAL_MAX_USD
          -e UV_PROJECT_ENVIRONMENT=/work/.venv -e PYTHONPATH=/work
          -v "$RUNNER_TEMP:/out" specster:evals -- sh -c
          'mkdir /work && cd /work && tar xf - && uv sync --all-groups --locked &&
          uv run pytest evals/test_build_bench.py -m eval -v --eval-k "$EVAL_K"
          --eval-max-usd "$EVAL_MAX_USD" --eval-out /out/specster-evals.jsonl'
      - name: summary table
        if: always()
        run: uv run python -m evals.summary "$RUNNER_TEMP/specster-evals.jsonl" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/specster-evals.jsonl
