- id: good-questions
  label: good
  kind: questions
  rubric: [questions_change_the_spec, questions_not_answerable_from_repo]
  thread: |
    # Exports are bad

    The exports are bad, please improve them.
  output:
    summary: >
      The repository has one export, to_json in reports/export.py, which dumps the report rows.
      The issue does not say what is wrong with it or what "improve" means.
    questions:
      - question: "Which formats are bad: JSON only, or new ones missing?"
        why: Fixing to_json and adding a new format (CSV, YAML) are different changes.
        options: [JSON only, New formats are missing, Both]
      - question: "Bad how: wrong data, encoding, or speed?"
        why: Each one points to a different fix in to_json and a different test.
        options: [Wrong data, Encoding, Speed]

