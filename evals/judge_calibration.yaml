- id: good-spec
  label: good
  kind: spec
  rubric: [spec_is_implementable, tasks_are_small_and_ordered]
  thread: |
    # Add CSV export next to JSON export

    reports/export.py has to_json. Add to_csv(report) that writes the same rows as CSV with a
    header row, comma separator, UTF-8. Add a test next to the JSON one.
  output:
    title: Add CSV export next to the JSON export
    objective: Export a Report as CSV with the same rows to_json writes.
    in_scope:
      - to_csv(report) in reports/export.py
      - A test for to_csv next to the JSON test
    out_of_scope:
      - Changing to_json
      - Other formats
    files: [reports/export.py, tests/test_export.py]
    approach: >
      Use csv.DictWriter over report.rows, writing to an io.StringIO, and return the text as a
      str, as to_json does; encoding to UTF-8 bytes is the caller's, so non-ASCII values stay
      as they are. The header is the union of every row's keys in first-seen order, a missing
      cell is written empty (restval=""), fields are comma-separated and lines end with "\n"
      (lineterminator="\n"). An empty report returns an empty string, with no header.
    risks:
      - Values with commas, quotes or newlines; csv's default QUOTE_MINIMAL quotes them, and the
        test covers one.
    test_strategy: >
      Unit tests in tests/test_export.py that parse the output with csv.reader: header and
      rows, a missing cell, a value with a comma and a non-ASCII one, and the empty report.
    tasks:
      - id: add-to-csv
        title: Add to_csv to reports/export.py
        description: >
          Implement to_csv(report) -> str with csv.DictWriter as described in the approach.
        files: [reports/export.py]
        acceptance:
          - The first line lists the union of the rows' keys in first-seen order.
          - Each later line holds one row's values in that column order, empty where missing.
          - Lines end with "\n", and an empty report gives "".
      - id: test-to-csv
        title: Test to_csv
        description: >
          Add tests next to the JSON test for the header, the rows, a missing cell, a value with
          a comma, a non-ASCII value and the empty report.
        files: [tests/test_export.py]
        depends_on: [add-to-csv]
        acceptance:
          - A row with a comma in a value parses back to the same value with csv.reader.
          - A non-ASCII value comes back unchanged, and a missing cell comes back as "".
          - to_csv(Report([])) is asserted to be "".

