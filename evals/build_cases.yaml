# Approved plans the build benchmark builds on evals/fixtures/build_repo. Each hidden check is
# a test the worker never sees; it runs on the built branch and says whether the code is right.
- id: csv-export
  spec: |
    Add to_csv(report) -> str to reports/export.py, next to to_json. It writes report.rows as
    CSV with csv.DictWriter: the header is the union of every row's keys in first-seen order,
    a missing cell is empty, fields are comma-separated, lines end with "\n", and an empty
    report returns "". Non-ASCII values stay as they are (the function returns a str).
  tasks:
    - id: add-to-csv
      title: Add to_csv with its tests
      description: >
        Implement to_csv in reports/export.py as the spec says, and test it in
        tests/test_export.py: header, rows, a missing cell, a non-ASCII value, the empty report.
      files: [reports/export.py, tests/test_export.py]
      acceptance:
        - The first line is the union of the rows' keys in first-seen order.
        - A missing cell is empty, lines end with "\n", and an empty report gives "".
  hidden: check_csv.py

- id: two-exporters
  spec: |
    Add two exporters, each in its own module with its own tests. reports/tsv.py:
    to_tsv(report) -> str, tab-separated, a header line with the first row's keys, then one
    line per row, each line ending with "\n"; an empty report returns "". reports/markdown.py:
    to_markdown(report) -> str, a Markdown table: "| a | b |", then "| --- | --- |", then one
    "| x | y |" line per row, lines joined with "\n" and no trailing newline; an empty report
    returns "".
  tasks:
    - id: add-tsv
      title: Add to_tsv
      description: Implement reports/tsv.py and tests/test_tsv.py as the spec says.
      files: [reports/tsv.py, tests/test_tsv.py]
      acceptance:
        - to_tsv writes a header line and one tab-separated line per row, each ending with "\n".
    - id: add-markdown
      title: Add to_markdown
      description: Implement reports/markdown.py and tests/test_markdown.py as the spec says.
      files: [reports/markdown.py, tests/test_markdown.py]
      acceptance:
        - to_markdown writes the header row, the separator row and one row per report row.
  hidden: check_exporters.py

- id: total-then-summary
  spec: |
    Add Report.total(field) -> float to reports/model.py: the sum of float(row[field]) over
    the rows that have the field, 0.0 when none do. Then add summary(report) -> str to
    reports/export.py, returning f"{len(report.rows)} rows, total amount {total:.2f}" where
    total is report.total("amount"). Each change comes with its tests.
  tasks:
    - id: add-total
      title: Add Report.total
      description: Implement Report.total in reports/model.py, tested in tests/test_model.py.
      files: [reports/model.py, tests/test_model.py]
      acceptance:
        - total sums the field over the rows that have it, and is 0.0 when none do.
    - id: add-summary
      title: Add summary
      description: >
        Implement summary in reports/export.py on top of Report.total, tested in
        tests/test_summary.py.
      files: [reports/export.py, tests/test_summary.py]
      depends_on: [add-total]
      acceptance:
        - summary gives "<rows> rows, total amount <total with two decimals>".
  hidden: check_summary.py

- id: rename-with-alias
  spec: |
    Rename Report.rows to Report.records in reports/model.py, without breaking callers.
    Report([...]) and Report(records=[...]) build a report, and Report() an empty one.
    Report(rows=[...]) still works but emits a DeprecationWarning, and so does reading
    report.rows, which returns report.records. Every caller in reports/ moves to records, so
    to_json emits no warning. The existing test moves to the new name, and new tests cover
    both deprecated paths.
  tasks:
    - id: rename-rows
      title: Rename rows to records with a deprecated alias
      description: >
        Change Report in reports/model.py, to_json in reports/export.py, sum_amounts in
        reports/totals.py and tests/test_export.py to records, and add tests/test_model.py for the deprecated
        rows= argument and rows attribute.
      files:
        [reports/model.py, reports/export.py, reports/totals.py, tests/test_export.py, tests/test_model.py]
      acceptance:
        - Report([...]), Report(records=[...]) and Report() work with no warning.
        - Report(rows=[...]) and reading report.rows emit a DeprecationWarning.
        - to_json emits no warning.
  hidden: check_rename.py

- id: bug-fix-from-symptom
  spec: |
    sum_amounts in reports/totals.py raises ValueError on amounts written with a thousands
    separator: sum_amounts(Report([{"amount": "1,234.50"}, {"amount": "10"}])) should be
    1244.5. Amounts are written like "12", "12.5", "1,234.50", with optional spaces around
    them, and "(5)" means -5. Fix the cause, wherever it is, and add a test for each form.
  tasks:
    - id: fix-amounts
      title: Parse every written amount form
      description: >
        Find why sum_amounts fails on "1,234.50" and fix it at the cause, so every form in the
        spec parses; test each form.
      files: [reports/amounts.py, tests/test_amounts.py]
      acceptance:
        - parse_amount reads "12", "12.5", "1,234.50", " 7 " and "(5)" as 12, 12.5, 1234.5, 7 and -5.
        - sum_amounts gives 1244.5 for the example in the spec.
  hidden: check_amounts.py

- id: csv-round-trip
  spec: |
    Add reports/csv_io.py with to_csv(report) -> str and from_csv(text) -> Report, so that
    from_csv(to_csv(r)).rows == r.rows for any rows of str values. to_csv writes a header with
    the union of the rows' keys in first-seen order, empty cells for missing keys, and "\n"
    line endings. from_csv reads that back, and also accepts "\r\n" line endings and a UTF-8
    byte order mark ("\ufeff") at the start; a missing or empty cell comes back as "". Empty
    text gives Report([]). Values may hold commas, quotes and newlines.
  tasks:
    - id: add-csv-io
      title: Add to_csv and from_csv
      description: Implement reports/csv_io.py and tests/test_csv_io.py as the spec says.
      files: [reports/csv_io.py, tests/test_csv_io.py]
      acceptance:
        - Round-trips rows whose values hold commas, quotes and newlines.
        - Reads "\r\n" endings and a leading byte order mark; empty text gives Report([]).
  hidden: check_csv_io.py

- id: exporter-registry
  spec: |
    Add an exporter registry. reports/registry.py: register(name) is a decorator that records
    a function Report -> str under that name; export(report, name) calls it; formats() lists the
    names sorted; export with an unknown name raises ValueError whose message lists the known
    names. Then register to_json as "json" in reports/export.py, and add reports/text.py with
    to_text registered as "text": one line per row, "key=value" pairs joined with ", " in the
    row's key order, lines ending with "\n". Importing reports registers both formats, and
    to_json keeps working as before.
  tasks:
    - id: add-registry
      title: Add the registry
      description: Implement reports/registry.py and tests/test_registry.py as the spec says.
      files: [reports/registry.py, tests/test_registry.py]
      acceptance:
        - register, export and formats behave as the spec says, and unknown names raise ValueError.
    - id: register-exporters
      title: Register json and text
      description: >
        Register to_json as "json", add reports/text.py with to_text as "text", and make
        importing reports register both; test the text format.
      files: [reports/export.py, reports/text.py, reports/__init__.py, tests/test_text.py]
      depends_on: [add-registry]
      acceptance:
        - After import reports, formats() == ["json", "text"].
        - export(report, "json") equals to_json(report).
  hidden: check_registry.py
